{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudyQuest{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'reviewer/css/style.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'reviewer:course_list' %}">🎮 StudyQuest</a>
        <div class="stats">
            <span class="stat" title="Level">🏅 Lv. 1</span>
            <span class="stat" title="XP">⭐ 0 XP</span>
            <span class="stat" title="Streak">🔥 0 day streak</span>
        </div>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>StudyQuest — turn studying into a quest. <em>MVP scaffold, AI features not wired up yet.</em></p>
    </footer>
</body>
</html>
